name: Build chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - run: |
          find ~/.gradle/caches/modules-2/files-2.1/com.google.ai.edge.litertlm/litertlm-android -type f -name "*.aar" -print

      - run: |
          AAR=$(find ~/.gradle/caches/modules-2/files-2.1/com.google.ai.edge.litertlm/litertlm-android -type f -name "*.aar" | head -n 1)
          echo "=== AAR ==="
          echo "$AAR"
          echo "=== AAR CONTENTS ==="
          unzip -l "$AAR" | sed -n '1,200p'

      - run: gradle :app:mergeDebugAssets --stacktrace
